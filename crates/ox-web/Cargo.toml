[package]
name = "ox-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/freeoxen/ox"
homepage = "https://freeoxen.github.io/ox/"
authors = ["Adjective Noun, LLC"]
description = "Browser Wasm shell for the ox agent framework with JS tool registration"
readme = "README.md"
keywords = ["agent", "ai", "wasm", "webassembly", "browser"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ox-core = { workspace = true }
ox-context = { workspace = true }
ox-gate = { workspace = true }
ox-history = { workspace = true }
ox-kernel = { workspace = true }
ox-tools = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
