[package]
name = "ox-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Typed remote-provider Store adapters for ox"

[dependencies]
async-trait = { workspace = true }
ox-broker = { workspace = true }
ox-inbox = { workspace = true }
ox-structfs-transport = { workspace = true }
ox-types = { workspace = true }
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
structfs-core-store = { workspace = true, features = ["async"] }
structfs-serde-store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[dev-dependencies]
rand = "0.10"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
