[package]
name = "ox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Ratatui-based agentic coding CLI for the ox agent framework"
publish = false

[lib]
name = "ox_cli"
path = "src/lib.rs"

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
parking_lot = { workspace = true }
ox-path = { workspace = true }
ox-remote = { workspace = true }
ox-structfs-transport = { workspace = true }
ox-kernel = { workspace = true }
ox-context = { workspace = true }
ox-executor = { workspace = true }
ox-gate = { workspace = true }
ox-history = { workspace = true }
ox-runtime = { workspace = true }
ox-inbox = { workspace = true }
ox-broker = { workspace = true }
ox-ui = { workspace = true }
ox-store-util = { workspace = true }
ox-tools = { workspace = true }
ox-types = { workspace = true }
horns-core = { workspace = true }
horns-ratatui = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "signal"] }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
clash = { workspace = true }
ox-config = { workspace = true }
# Not used directly: constrains the transitive allocative dep below 0.3.6,
# which moved to hashbrown 0.16 and no longer implements Allocative for the
# hashbrown-0.14 types starlark_map 0.13 (via clash) derives it on —
# breaking every clean build. Drop when clash's starlark moves past 0.13.
allocative = ">=0.3, <0.3.6"
namecode = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
# Crash-harness #[tokio::test]s need rt-multi-thread + macros.
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
