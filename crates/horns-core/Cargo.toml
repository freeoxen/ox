[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "horns-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Path-MVU UI framework primitives — View enum, dispatcher, registries, broker-mount install API"

[dependencies]
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
ox-broker = { path = "../ox-broker" }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
