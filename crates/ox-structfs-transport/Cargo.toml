[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "ox-structfs-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Bounded canonical-CBOR wire protocol for transporting generic StructFS operations"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
ox-broker = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
russh = { workspace = true }
structfs-core-store = { workspace = true, features = ["async"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "net", "rt-multi-thread"] }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
