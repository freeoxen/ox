[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "ox-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async BrokerStore for StructFS — routes reads/writes between stores by path prefix"
keywords = ["agent", "ai", "structfs", "broker", "async"]
categories = ["data-structures", "asynchronous"]

[dependencies]
tracing = { workspace = true }
horns-core = { workspace = true }
serde = { workspace = true }
structfs-core-store = { workspace = true, features = ["async"] }
structfs-serde-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ox-store-util = { path = "../ox-store-util" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
