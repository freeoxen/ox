<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ox-gateway</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --surface-2: #f2f1ee;
    --line: #dddbd4;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a887f;
    --series-1: #2a78d6;   /* input tokens */
    --series-2: #eb6834;   /* output tokens */
    --seq: #2a78d6;        /* single-series activity */
    --seq-dim: #9ec5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19;
      --surface-2: #232322;
      --line: #3a3937;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8a887f;
      --series-1: #3987e5;
      --series-2: #d95926;
      --seq: #3987e5;
      --seq-dim: #1c5cab;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface);
    color: var(--text-primary);
    padding: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { color: var(--text-muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  section { margin-bottom: 32px; }
  section h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  section .caption { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--text-secondary); font-size: 11px; }
  svg .val { fill: var(--text-secondary); }
  svg .axis { stroke: var(--line); stroke-width: 1; }
  .bar-hit:hover { opacity: 0.85; cursor: default; }
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--text-primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); white-space: nowrap;
  }
  #tooltip .t-label { color: var(--text-muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>ox-gateway</h1>
  <span class="sub" id="meta">loading…</span>
</header>

<div class="tiles" id="tiles"></div>

<section>
  <h2>Tokens by model</h2>
  <div class="caption">All time, sorted by total tokens</div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--series-1)"></span>Input</span>
    <span><span class="swatch" style="background:var(--series-2)"></span>Output</span>
  </div>
  <div id="models"></div>
</section>

<section>
  <h2>Requests per hour</h2>
  <div class="caption">Last 24 hours, local time</div>
  <div id="activity"></div>
</section>

<section>
  <h2>Recent requests</h2>
  <div class="caption" id="recent-caption"></div>
  <div id="recent"></div>
</section>

<div id="tooltip"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function compact(n) {
  if (n == null) return "—";
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
  return n.toLocaleString();
}
function cost(t) {
  if (t.estimated_cost_usd == null) return "—";
  const c = "$" + t.estimated_cost_usd.toFixed(t.estimated_cost_usd < 1 ? 4 : 2);
  return t.priced_requests < t.requests ? `${c} (${t.priced_requests} of ${t.requests} priced)` : c;
}

const tooltip = $("tooltip");
function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  const pad = 12;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTip() { tooltip.style.display = "none"; }

function renderTiles(s) {
  const t = s.today, a = s.totals;
  const items = [
    { label: "Requests today", value: t.requests.toLocaleString(), note: `${a.requests.toLocaleString()} all time` },
    { label: "Input tokens today", value: compact(t.input_tokens), note: `${compact(a.input_tokens)} all time` },
    { label: "Output tokens today", value: compact(t.output_tokens), note: `${compact(a.output_tokens)} all time` },
    { label: "Est. cost today", value: t.estimated_cost_usd == null ? "—" : cost(t).split(" ")[0], note: cost(a) },
    { label: "In flight", value: s.in_flight.toLocaleString(), note: "open requests" },
  ];
  $("tiles").innerHTML = items.map((i) =>
    `<div class="tile"><div class="label">${esc(i.label)}</div><div class="value">${esc(i.value)}</div><div class="note">${esc(i.note)}</div></div>`
  ).join("");
}

function renderModels(rows) {
  if (!rows.length) { $("models").innerHTML = `<div class="empty">No completions yet</div>`; return; }
  const width = Math.min(1032, document.body.clientWidth - 48);
  const labelW = Math.min(280, Math.floor(width * 0.34));
  const chartW = width - labelW - 70;
  const barH = 20, rowH = 30;
  const max = Math.max(...rows.map((r) => r.input_tokens + r.output_tokens));
  const px = (v) => max ? Math.round((v / max) * chartW) : 0;
  let svg = "";
  rows.forEach((r, i) => {
    const y = i * rowH;
    const name = `${r.account}/${r.model_id}`;
    const inW = px(r.input_tokens), outW = px(r.output_tokens);
    const gap = inW > 0 && outW > 0 ? 2 : 0;
    const total = r.input_tokens + r.output_tokens;
    const tip = `<span class="t-label">${esc(name)}</span><br>` +
      `input ${r.input_tokens.toLocaleString()} · output ${r.output_tokens.toLocaleString()}<br>` +
      `${r.requests.toLocaleString()} requests`;
    svg += `<g class="bar-hit" data-tip="${esc(tip)}">` +
      `<title>${esc(name)}: ${total.toLocaleString()} tokens</title>` +
      `<text x="${labelW - 8}" y="${y + barH / 2 + 4}" text-anchor="end">${esc(truncate(name, 38))}</text>` +
      (inW > 0 ? `<rect x="${labelW}" y="${y + (rowH - barH) / 2}" width="${inW}" height="${barH}" rx="2" fill="var(--series-1)"/>` : "") +
      (outW > 0 ? `<rect x="${labelW + inW + gap}" y="${y + (rowH - barH) / 2}" width="${outW}" height="${barH}" rx="2" fill="var(--series-2)"/>` : "") +
      `<text class="val" x="${labelW + inW + gap + outW + 6}" y="${y + barH / 2 + 4}">${compact(total)}</text>` +
      `</g>`;
  });
  $("models").innerHTML =
    `<svg width="${width}" height="${rows.length * rowH}" role="img" aria-label="Tokens by model">${svg}</svg>`;
  attachTips($("models"));
}

function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function renderActivity(buckets) {
  const width = Math.min(1032, document.body.clientWidth - 48);
  const h = 120, axisH = 18, plotH = h - axisH;
  const n = buckets.length;
  const slot = width / n, barW = Math.max(4, Math.floor(slot) - 2);
  const max = Math.max(1, ...buckets.map((b) => b.requests));
  let svg = `<line class="axis" x1="0" y1="${plotH}" x2="${width}" y2="${plotH}"/>`;
  buckets.forEach((b, i) => {
    const x = Math.round(i * slot);
    const bh = Math.round((b.requests / max) * (plotH - 8));
    const d = new Date(b.hour_start_ms);
    const label = d.toLocaleTimeString([], { hour: "numeric" });
    const tip = `<span class="t-label">${esc(d.toLocaleString([], { weekday: "short", hour: "numeric" }))}</span><br>` +
      `${b.requests.toLocaleString()} requests<br>` +
      `in ${compact(b.input_tokens)} · out ${compact(b.output_tokens)}`;
    svg += `<g class="bar-hit" data-tip="${esc(tip)}">` +
      `<rect x="${x}" y="0" width="${Math.ceil(slot)}" height="${plotH}" fill="transparent"/>` +
      (b.requests > 0
        ? `<rect x="${x + Math.floor((slot - barW) / 2)}" y="${plotH - bh}" width="${barW}" height="${bh}" rx="2" fill="var(--seq)"/>`
        : "") +
      `</g>`;
    if (i % 4 === 0) {
      svg += `<text x="${x + slot / 2}" y="${h - 4}" text-anchor="middle">${esc(label)}</text>`;
    }
  });
  $("activity").innerHTML =
    `<svg width="${width}" height="${h}" role="img" aria-label="Requests per hour, last 24 hours">${svg}</svg>`;
  attachTips($("activity"));
}

function attachTips(root) {
  root.querySelectorAll(".bar-hit").forEach((g) => {
    g.addEventListener("pointermove", (ev) => showTip(ev, g.dataset.tip));
    g.addEventListener("pointerleave", hideTip);
  });
}

function renderRecent(recent) {
  $("recent-caption").textContent = recent.length ? `Last ${recent.length} completions` : "";
  if (!recent.length) { $("recent").innerHTML = `<div class="empty">No completions yet</div>`; return; }
  const rows = recent.map((r) => {
    const when = new Date(r.completed_at_ms).toLocaleTimeString();
    const dur = Math.max(0, r.completed_at_ms - r.started_at_ms);
    return `<tr><td>${esc(when)}</td><td>${esc(r.account)}/${esc(r.model_id)}</td>` +
      `<td>${esc(r.dialect)}→${esc(r.upstream_dialect)}</td>` +
      `<td class="num">${r.input_tokens.toLocaleString()}</td>` +
      `<td class="num">${r.output_tokens.toLocaleString()}</td>` +
      `<td class="num">${dur.toLocaleString()} ms</td>` +
      `<td class="num">${r.estimated_cost_usd == null ? "—" : "$" + r.estimated_cost_usd.toFixed(4)}</td></tr>`;
  }).join("");
  $("recent").innerHTML =
    `<table><thead><tr><th>Time</th><th>Model</th><th>Dialect</th>` +
    `<th class="num">In</th><th class="num">Out</th><th class="num">Duration</th><th class="num">Cost</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

async function refresh() {
  try {
    const s = await (await fetch("/stats")).json();
    $("meta").textContent = `updated ${new Date(s.generated_at_ms).toLocaleTimeString()}`;
    renderTiles(s);
    renderModels(s.by_model);
    renderActivity(s.by_hour);
    renderRecent(s.recent);
  } catch (e) {
    $("meta").textContent = "stats unavailable: " + e;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
