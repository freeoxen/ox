[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "ox-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Local LLM gateway exposing Anthropic / OpenAI APIs over the StructFS substrate"
keywords = ["ai", "llm", "gateway", "api", "structfs"]
categories = ["command-line-utilities"]

[[bin]]
name = "ox-gateway"
path = "src/main.rs"

[dependencies]
ox-types = { workspace = true }
ox-kernel = { workspace = true }
ox-broker = { workspace = true }
ox-gate = { workspace = true }
ox-config = { workspace = true }
ox-inbox = { workspace = true }
featherweight-runtime = { workspace = true }
structfs-service = { workspace = true }
ox-codec = { workspace = true }
ox-store-util = { workspace = true }
ox-ui = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
structfs-http = { workspace = true }

axum = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
tempfile = { workspace = true }
ox-gate = { path = "../ox-gate", features = ["test-utils"] }
