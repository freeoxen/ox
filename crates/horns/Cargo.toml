[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "horns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Path-MVU UI toolkit — umbrella crate"

[features]
default = ["ratatui"]
ratatui = ["dep:horns-ratatui"]

[dependencies]
horns-core = { workspace = true }
horns-ratatui = { workspace = true, optional = true }
