[package]
name = "ox-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "StructFS-native LLM transport layer — codecs, provider registry, and completion protocol"
readme = "README.md"
keywords = ["agent", "ai", "llm", "structfs", "transport"]
categories = ["api-bindings"]

[dependencies]
tracing = { workspace = true }
ox-kernel = { path = "../ox-kernel" }
ox-types = { path = "../ox-types" }
ox-path = { path = "../ox-path" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
async-trait = "0.1"
tokio = { workspace = true }

# `ox-broker` pulls in tokio with `rt-multi-thread`, which is unsupported
# on wasm. Only the `subscriptions` module needs it; see lib.rs for the
# matching cfg gate. ox-web/wasm builds skip subscriptions entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ox-broker = { path = "../ox-broker" }

[dev-dependencies]
ox-store-util = { path = "../ox-store-util" }
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
