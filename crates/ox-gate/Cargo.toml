[package]
name = "ox-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "StructFS-native LLM transport layer — codecs, provider registry, and completion protocol"
readme = "README.md"
keywords = ["agent", "ai", "llm", "structfs", "transport"]
categories = ["api-bindings"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
ox-kernel = { workspace = true }
ox-types = { workspace = true }
ox-path = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
async-trait = { workspace = true }
tokio = { workspace = true }

# `ox-broker` pulls in tokio with `rt-multi-thread`, which is unsupported
# on wasm. Only the `subscriptions` module needs it; see lib.rs for the
# matching cfg gate. ox-web/wasm builds skip subscriptions entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ox-broker = { workspace = true }

[dev-dependencies]
ox-store-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
