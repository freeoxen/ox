[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "ox-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "StructFS-native LLM transport layer — codecs, provider registry, and completion protocol"
keywords = ["agent", "ai", "llm", "structfs", "transport"]
categories = ["api-bindings"]

[features]
test-utils = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
ox-kernel = { workspace = true }
ox-codec = { workspace = true }
ox-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "stream", "json"] }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
tokio = { workspace = true }

# `ox-broker` pulls in tokio with `rt-multi-thread`, which is unsupported
# on wasm. Only the `subscriptions` module needs it; see lib.rs for the
# matching cfg gate. ox-web/wasm builds skip subscriptions entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ox-broker = { workspace = true }
ox-store-util = { workspace = true }
structfs-handles = "=0.2.0"
structfs-http = { workspace = true }

[dev-dependencies]
ox-store-util = { path = "../ox-store-util" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
