[package]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "build.rs", "artifacts/**", "gateway.assembly.yaml"]
publish = ["crates-io"]
name = "ox-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Sandboxed tool execution and file-system module for the ox agent framework"

[[bin]]
name = "ox-tool-exec"
path = "src/bin/ox-tool-exec.rs"

[dependencies]
ox-kernel = { workspace = true }
ox-gate = { workspace = true }
structfs-core-store = { workspace = true }
structfs-serde-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clash = { workspace = true }
# Keep standalone consumers compatible with Clash's Starlark/hashbrown versions.
allocative = ">=0.3, <0.3.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
